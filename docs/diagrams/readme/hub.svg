<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">One window into the project</title>
  <desc id="desc">The local MEX Hub brings three kinds of project work into one browser window: Explore with Wiki and Code, Review with Inbox and Specs, and Coordinate with Relays and Team. Health and Activity are also available. The Hub runs on the local machine at 127.0.0.1.</desc>
