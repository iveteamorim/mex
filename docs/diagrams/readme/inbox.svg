    <text x="1152" y="46" text-anchor="end" font-family="monospace" font-size="16" letter-spacing="2">08 / INBOX</text>
    <text x="48" y="110" font-family="Georgia, serif" font-size="42">A proposal before a promise.</text>
  </g>
