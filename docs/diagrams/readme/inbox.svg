<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">MEX Inbox: a proposal before a promise</title>
  <desc id="desc">A checkout-local draft is explicitly published as a proposal for human review. Approval applies the proposed change to a canonical Spec. Commit and push the canonical records to share them through Git.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.075"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <clipPath id="review-disc"><circle cx="600" cy="273" r="86"/></clipPath>
  </defs>
  <rect width="1200" height="520" fill="#226483"/>
  <rect width="1200" height="520" fill="#226483" filter="url(#grain)"/>
