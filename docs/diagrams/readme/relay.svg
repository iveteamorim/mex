<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">MEX Relay: give the next person the context</title>
  <desc id="desc">The sender prepares a local draft and explicitly publishes a Relay. Teammates share the canonical record with ordinary Git commit, push and pull. A recipient takes the Relay to acknowledge the handoff, and it can be closed later. MEX does not perform Git delivery automatically.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.075"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="#226483"/>
  <rect width="1200" height="520" fill="#226483" filter="url(#grain)"/>
  <g fill="#F1EEDC">
    <text x="48" y="46" font-family="monospace" font-size="16" letter-spacing="2">MEX / 0.8</text>
    <text x="1152" y="46" text-anchor="end" font-family="monospace" font-size="16" letter-spacing="2">02 / RELAY</text>
    <text x="48" y="110" font-family="Georgia, serif" font-size="42">Give the next person the context.</text>
  </g>
  <path d="M48 142H1152" stroke="#F1EEDC" stroke-width="1" opacity="0.35"/>

  <g fill="none" stroke="#F1EEDC" stroke-width="2">
    <path d="M292 216C434 216 449 244 528 262M292 251C416 251 457 266 528 272M292 293C416 293 457 280 528 276M292 328C434 328 449 302 528 286" opacity="0.75"/>
    <path d="M672 262C751 244 766 216 908 216M672 272C743 266 784 251 908 251M672 276C743 280 784 293 908 293M672 286C751 302 766 328 908 328" opacity="0.75"/>
    <ellipse cx="409" cy="273" rx="15" ry="52" opacity="0.5"/>
    <ellipse cx="791" cy="273" rx="15" ry="52" opacity="0.5"/>
  </g>

  <circle cx="212" cy="273" r="82" fill="#171B18"/>
  <g fill="none" stroke="#F1EEDC" stroke-width="2">
    <circle cx="212" cy="273" r="82"/>
    <ellipse cx="212" cy="273" rx="82" ry="25"/>
    <ellipse cx="212" cy="273" rx="34" ry="82"/>
    <path d="M139 237H285M139 309H285" opacity="0.6"/>
  </g>
  <circle cx="242" cy="253" r="15" fill="#FF5738"/>

  <circle cx="600" cy="273" r="72" fill="#171B18"/>
  <circle cx="600" cy="273" r="64" fill="none" stroke="#FF5738" stroke-width="2"/>
  <g fill="none" stroke="#FF5738" stroke-width="3" stroke-linecap="round">
    <path d="M587 248V303M587 282C619 282 621 270 621 248"/>
    <circle cx="587" cy="242" r="7" fill="#171B18"/>
    <circle cx="621" cy="242" r="7" fill="#171B18"/>
    <circle cx="587" cy="309" r="7" fill="#171B18"/>
  </g>

  <circle cx="988" cy="273" r="82" fill="#171B18"/>
  <g fill="none" stroke="#F1EEDC" stroke-width="2">
    <circle cx="988" cy="273" r="82"/>
    <ellipse cx="988" cy="273" rx="82" ry="25"/>
    <ellipse cx="988" cy="273" rx="34" ry="82"/>
    <path d="M915 237H1061M915 309H1061" opacity="0.6"/>
  </g>
  <circle cx="1018" cy="253" r="15" fill="#FF5738"/>
  <g fill="none" stroke="#F1EEDC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M453 272H478M469 265L478 272L469 279M850 272H875M866 265L875 272L866 279"/>
  </g>

  <g fill="#F1EEDC" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif">
    <text x="212" y="393" font-size="24">Draft &amp; publish</text>
    <text x="600" y="393" font-size="24">Share with Git</text>
    <text x="988" y="393" font-size="24">Take the Relay</text>
    <g font-size="20" opacity="0.8">
      <text x="212" y="423">Sender prepares context</text>
      <text x="600" y="423">Commit · push · pull</text>
      <text x="988" y="423">Recipient acknowledges</text>
    </g>
  </g>
  <path d="M48 448H1152" stroke="#F1EEDC" stroke-width="1" opacity="0.35"/>
  <text x="48" y="480" fill="#F1EEDC" font-family="Trebuchet MS, Verdana, sans-serif" font-size="20">A durable handoff. Every canonical update travels through Git.</text>
</svg>
